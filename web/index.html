<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*,*::before,*::after{border-radius:0!important}
@font-face{font-family:Figtree;src:url(/fonts/Figtree.ttf) format("truetype");font-weight:300 900;font-display:swap}
:root{--bg:#f6f6f3;--panel:#fff;--panel2:#fbfbf9;--ink:#191917;--mut:#6b6b64;--line:#e5e5df;--acc:#2f6fed;--acc-ink:#fff;--ok:#2f9e44;--warn:#e8890c;--bad:#d92d20;--info:#3b82f6;--shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);

:root[data-theme=dark]{--bg:#111110;--panel:#1a1a18;--panel2:#161614;--ink:#ecebe6;--mut:#9a9a92;--line:#2b2b28;--acc:#6b9bff;--acc-ink:#0b0b0a;--ok:#4cc16a;--warn:#f3a33b;--bad:#ff6b5e;--info:#6ea8ff;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}

*{box-sizing:border-box}html,body{height:100%}body{height:100vh;overflow:hidden;margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;grid-template-columns:224px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);transition:grid-template-columns .15s}
body.collapsed{grid-template-columns:64px minmax(0,1fr)}
body.collapsed .lbl,body.collapsed .brand div,body.collapsed .nav .n,body.collapsed .foot{display:none}body.collapsed .nav{justify-content:center;padding:10px 0}body.collapsed .brand{flex-direction:column;gap:6px;padding:4px 0 10px}.brand svg{flex:none}body.collapsed #collapse{margin:0 auto}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}.ico.lg{width:20px;height:20px}

.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}.pipe .card{padding:12px}.pipe b{font-size:24px;display:block;line-height:1.1}
button,input,select{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:0}
a{color:var(--acc)}code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}

#side .nav{flex:0 1 auto;min-height:34px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px}#collapse{margin-left:auto;border:0;background:none;color:var(--mut);cursor:pointer;padding:4px;border-radius:0}#collapse:hover{background:var(--panel2);color:var(--ink)}.brand b{font-weight:700;font-size:16px;letter-spacing:-.01em}.brand small{display:block;color:var(--mut);font-size:11px;margin-top:-2px}

.steps{display:flex;gap:4px;align-items:center}.step{font-size:11px;font-weight:600;padding:3px 9px;border-radius:0;background:var(--panel2);border:1px solid var(--line);color:var(--mut)}.step.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}.step.cur{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}

.btn{display:inline-block;border:1px solid var(--line);background:var(--panel);padding:6px 13px;border-radius:0;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink)}.btn:hover{border-color:var(--mut)}.btn.p{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}.btn.d{border-color:color-mix(in srgb,var(--bad) 50%,var(--line));color:var(--bad)}.btn:disabled{opacity:.4;cursor:default}.btn.sm{padding:3px 10px;font-size:12px}
.dot{width:8px;height:8px;border-radius:0;background:var(--nit);display:inline-block;flex:none}.dot.running{background:var(--codex);animation:p 1.2s infinite}.dot.done{background:var(--ok)}.dot.failed,.dot.tamper{background:var(--bad)}.dot.live{background:var(--ok)}.dot.stale{background:var(--warn)}
@keyframes p{50%{opacity:.35}}@media (prefers-reduced-motion:reduce){.dot.running{animation:none}}
main{padding:22px 28px 60px;width:100%;min-height:0;overflow-y:auto;overflow-x:hidden}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:22px 0 10px;font-weight:700}h2:first-child{margin-top:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:0;padding:14px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}.kpi .l{color:var(--mut);font-size:12px;font-weight:500}.kpi .s{font-size:12px;color:var(--mut);margin-top:4px}
.banner{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:0;background:color-mix(in srgb,var(--acc) 11%,var(--panel));border:1px solid color-mix(in srgb,var(--acc) 35%,var(--line));flex-wrap:wrap}.banner b{font-size:15px}
.agent{display:flex;gap:12px;cursor:pointer}.agent:hover{border-color:var(--mut)}.agent .t{min-width:0;flex:1}.now{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:600;font-size:12px;background:var(--panel2);position:sticky;top:0}tbody tr:hover{background:var(--panel2)}tr.click{cursor:pointer}
.tw{border:1px solid var(--line);border-radius:0;overflow:auto;background:var(--panel);max-height:70vh}
.sev,.st{font-size:11px;font-weight:700;padding:2px 8px;border-radius:0;color:#fff;white-space:nowrap;display:inline-block}.sev.blocker{background:var(--blocker)}.sev.major{background:var(--major)}.sev.minor{background:var(--minor)}.sev.nit{background:var(--nit)}

.bar{display:flex;height:10px;border-radius:0;overflow:hidden;background:var(--line)}.bar i{display:block;height:100%}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.tools input[type=search]{flex:1;min-width:200px;padding:7px 12px;border:1px solid var(--line);border-radius:0;background:var(--panel)}
.pill{border:1px solid var(--line);background:var(--panel);padding:4px 11px;border-radius:0;cursor:pointer;font-size:12px;font-weight:600;color:var(--mut)}.pill[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.feed>div{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--line);align-items:center;font-size:13px}.feed time{color:var(--mut);font-size:11px;width:34px;flex:none}.feed span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--mut);padding:36px;text-align:center}.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
#drawer{position:fixed;top:0;right:0;height:100vh;width:min(620px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(105%);transition:transform .18s;z-index:30;overflow:auto;padding:20px}#drawer.open{transform:none}@media (prefers-reduced-motion:reduce){#drawer{transition:none}}
#drawer h3{margin:0 0 6px;font-size:17px}#drawer h4{margin:18px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}#drawer pre{background:var(--panel2);border:1px solid var(--line);border-radius:0;padding:10px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin:0}
.x{float:right}.kv{display:grid;grid-template-columns:90px 1fr;gap:4px 12px}.kv dt{color:var(--mut)}.kv dd{margin:0;word-break:break-word}
#pop{position:fixed;pointer-events:none;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:0;padding:10px 13px;box-shadow:var(--shadow);max-width:320px;display:none;font-size:12px}#pop h4{margin:0 0 5px;font-size:13px}#pop dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}#pop dt{color:var(--mut)}#pop dd{margin:0}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:0;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}#toast.on{opacity:1}
#graph,.gsvg{display:block;width:100%;height:calc(100vh - 330px);min-height:460px;border:1px solid var(--line);border-radius:0;background:var(--panel)}.legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 10px;font-size:12px;color:var(--mut)}
.lanes{display:flex;gap:8px;flex-wrap:wrap}.lane{padding:6px 11px;border-radius:0;border:1px dashed var(--line);font-size:12px;color:var(--mut)}.lane.busy{border-style:solid;border-color:var(--codex);color:var(--ink)}
#jsteps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}.jstep{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:0;padding:12px}.jstep .n{width:24px;height:24px;border-radius:0;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--line);margin-bottom:8px}.jstep.done .n{background:var(--ok);color:#fff}.jstep.current{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}.jstep.current .n{background:var(--acc);color:var(--acc-ink)}.jstep b{display:block}.jstep p{margin:4px 0 0;color:var(--mut);font-size:12px}.jstep .who{margin-top:6px;font-size:11px;color:var(--mut)}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.col{background:var(--panel2);border:1px solid var(--line);border-radius:0;padding:8px;min-height:90px}.col h4{margin:2px 4px 8px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}.wi{background:var(--panel);border:1px solid var(--line);border-radius:0;padding:8px 10px;margin-bottom:7px;font-size:13px}.wi .o{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.wi.test{border-left:3px solid var(--codex)}.wi.fix{border-left:3px solid var(--fix)}.wi.verify{border-left:3px solid var(--warn)}
details.tech{margin-top:8px}details.tech summary{cursor:pointer;color:var(--mut);font-size:12px}details.tech pre{background:var(--panel2);border:1px solid var(--line);border-radius:0;padding:8px;white-space:pre-wrap;word-break:break-word;margin:6px 0 0}.plain{margin-top:6px;font-size:13px}.plain .nx{color:var(--mut)}
.tl{border-left:2px solid var(--line);margin:6px 0 0 6px;padding-left:12px}.tl div{position:relative;padding:3px 0;font-size:13px}.tl div:before{content:"";position:absolute;left:-18px;top:9px;width:8px;height:8px;border-radius:0;background:var(--acc)}
@media(max-height:720px){#side{padding:10px 10px;gap:2px}#side .nav{padding:6px 10px;min-height:30px}.brand{padding:2px 8px 8px}#side .foot{display:none}}
@media(max-height:560px){.brand small{display:none}#side .nav{padding:4px 10px;min-height:26px}}
@media(max-width:860px){.board{grid-template-columns:1fr}}
@media(max-width:860px){body,body.collapsed{grid-template-columns:minmax(0,1fr);height:auto;overflow:auto}main{overflow:visible}#side{overflow-x:auto;overflow-y:hidden}body.collapsed .lbl{display:inline}#side{grid-row:auto;flex-direction:row;height:auto;min-height:auto}#side .foot,.brand small,#side .sp{display:none}.nav .n{display:none}.nav{width:auto;white-space:nowrap}main{padding:16px}}
</style></head><body>
<nav id="side" aria-label="Sections"></nav>
<header id="top"></header>
<main id="view" tabindex="-1"></main>
<aside id="drawer" aria-label="Details" role="dialog"></aside>
<div id="pop" role="tooltip"></div><div id="toast" role="status" aria-live="polite"></div>
<script nonce="__NONCE__" src="/vendor/iconoir.js"></script>

<script nonce="__NONCE__">
const $=s=>document.querySelector(s);
const h=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KPI_IC={'Agents running':'agents','Rules tested':'tests','Confirmed findings':'bug','Health score':'gauge','Fix queue':'cycle','Elapsed':'clock','Audit log':'audit','Knowledge graph':'graph'};
const num=x=>Number.isFinite(Number(x))?Number(x):0;
const FAM={claude:'var(--claude)',codex:'var(--codex)',opencode:'var(--opencode)',tool:'var(--tool)',fix:'var(--fix)'};
const SEVC={blocker:'var(--blocker)',major:'var(--major)',minor:'var(--minor)',nit:'var(--nit)'};
const PETS=['cat','dog','fox','panda','frog','rabbit','owl','penguin','bear','koala'];
const hash=s=>[...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const PAGES=[['journey','Journey'],['overview','Overview'],['agents','Agents'],['tests','Tests'],['findings','Findings'],['fixes','Fix cycle'],['audit','Audit log'],['report','Report'],['graph','Knowledge'],['team','Team']];
let S=null,page=store.get('tusk.page'),filters={sev:'all',q:'',st:'all',tq:'',aq:'',fx:'all',atab:'cards',tag:'',gq:'',types:{issue:1,file:1,rule:1,area:0,test:1,fix:1,agent:0}},kbData=null,lastOK=0,reportData=null,auditData=null;
if(!PAGES.some(p=>p[0]===page))page='journey';
const PHEAD={journey:['Journey','The whole cycle from set-up to re-test: where you are, who is doing what, and what you do next'],overview:['Overview','Live state of this UAT run and what to do next'],agents:['Agents','Who is testing what, on which lane, with which model'],tests:['Tests','Which business rules were checked, by whom, and how each replay went'],findings:['Findings','Replay-confirmed problems, merged across agents'],fixes:['Fix cycle','Each issue from found to fixed to re-verified. Read-only: approvals happen in chat with /tusk-fix'],audit:['Audit log','Tamper-evident record of every phase, replay, verdict and fix change'],report:['Report','What to hand to whoever fixes it'],team:['Team','One orchestrator and your worker agents. Changes here are proposals: the orchestrator applies them after you agree in chat'],graph:['Knowledge graph','Code, rules, issues, tests and fixes, and how they connect']};
const ICON=window.TUSK_ICONS||{};   // Iconoir (MIT), self-hosted in /vendor/
ICON.team=ICON.agents;
const ic=(n,c)=>`<svg class="ico ${c||''}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]||''}</svg>`;

/* theme: auto follows the OS, light/dark override and persist */
function applyTheme(t){const r=document.documentElement;if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t)}
let theme=store.get('tusk.theme');if(!['auto','light','dark'].includes(theme))theme='auto';applyTheme(theme);
function cycleTheme(){theme={auto:'light',light:'dark',dark:'auto'}[theme];store.set('tusk.theme',theme);applyTheme(theme);renderTop();toast('Theme: '+theme)}

/* avatars: DiceBear "Gaze" (CC0), generated in the browser from the agent id, so the same agent always has the same face */
const AVC={};
function pet(id,color,size,kind,badge){
  const key=[id,color,size,kind||'',badge?1:0].join('|');if(AVC[key])return AVC[key];
  let inner='';try{inner=window.uatGaze(kind==='elephant'?'orchestrator':id).replace(/<metadata[\s\S]*?<\/metadata>/,'').replace(/^<svg[^>]*?viewBox="([^"]+)"[^>]*>/,'<svg x="6" y="6" width="52" height="52" viewBox="$1">')}catch(e){}
  const wr=badge?`<g transform="translate(40 40)"><rect width="20" height="20" fill="#8b5cf6"/><svg x="3" y="3" width="14" height="14" viewBox="0 0 24 24" fill="none" style="color:#fff">${ICON.tools||''}</svg></g>`:'';
  return AVC[key]=`<svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true"><defs><clipPath id="avclip"><rect x="6" y="6" width="52" height="52"/></clipPath></defs><rect x="2" y="2" width="60" height="60" fill="${color}" fill-opacity=".16"/><rect x="3.5" y="3.5" width="57" height="57" fill="none" stroke="${color}" stroke-width="3"/><g clip-path="url(#avclip)">${inner||`<rect x="6" y="6" width="52" height="52" fill="${color}"/>`}</g>${wr}</svg>`}
const acol=a=>a.role==='fix'?FAM.fix:FAM[a.family]||FAM.tool;
const apet=(a,s)=>pet(a.id,acol(a),s,null,a.role==='fix');
const ORCH=s=>pet('orch','#6b7280',s||40,'elephant');

/* helpers */
const ago=t=>{const s=Math.max(0,Math.round(S.now-t));return s<60?s+'s':s<3600?Math.round(s/60)+'m':Math.round(s/3600)+'h'};
const mmss=s=>{s=Math.max(0,Math.round(s));return s>=3600?`${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m`:`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const dur=a=>a.started?mmss((a.ended||S.now)-a.started):'-';
function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),ms||2200)}
const sevchip=s=>`<span class="sev ${h(s)}">${h(s)}</span>`,stchip=s=>`<span class="st ${h(s)}">${h(String(s).replace(/-/g,' '))}</span>`;
const empty=(t,d)=>`<div class="empty"><b>${h(t)}</b>${h(d||'')}</div>`;
const EVT={assign:'was assigned work',retest:'re-tested',agent_start:'started',agent_done:'finished',model_exhausted:'ran out of model quota',lane_reset:'reset a lane',replay:'replayed',clusters:'grouped findings',validate:'validated findings',report_built:'built the report',verdict:'gave a verdict',fix_state:'moved a fix',wave:'started a wave',phase:'update',step:'',check:'checked'};
function evText(e){const base=EVT[e.type]??e.type;const x=e.text||e.now||(e.rule?e.rule+' '+(e.result||''):'')||e.status||e.state||'';return `${h(base)} ${h(x)}`.trim()}
async function api(path){const r=await fetch(path);if(!r.ok)throw new Error(r.status);return r.json()}
const mpet=(id,fam)=>pet(id,FAM[fam]||FAM.tool,16);
const modelOf=x=>`${h(x.family||'?')} / ${h(x.model||'?')}${x.fallback?' (fallback model)':''}`;
const fbchip=x=>`<span class="chip" title="${h(x.id)}: ${h(x.family)} / ${h(x.model)}, lens ${h(x.lens)}, lane ${h(x.lane)}${x.fallback?'. Planned model '+h(x.planned_model)+' did not answer, a fallback was used.':''}">${mpet(x.id,x.family)} <b>${h(x.id)}</b> ${h(x.model||x.family)}</span>`;
const plainBlock=(w,tech)=>w&&w.plain?`<div class="plain">${h(w.plain)}${w.next?` <span class="nx">${h(w.next)}</span>`:''}</div>${tech?`<details class="tech"><summary>Technical details</summary><pre>${h(tech)}</pre></details>`:''}`:'';
const petFor=id=>{const a=S.agents.find(x=>x.id===id);return a?apet(a,20):ORCH(20)};

/* shell */
function renderSide(){
  const q=S.fixqueue.filter(i=>i.state==='proposed').length,run=S.summary.agents.running;
  const badge={agents:run?[run,0]:null,fixes:q?[q,1]:null,findings:S.clusters.length?[S.clusters.length,0]:null,tests:S.summary.tests.rules?[S.summary.tests.rules,0]:null,audit:S.audit.count?[S.audit.count,0]:null};
  $('#side').innerHTML=`<div class="brand">${ORCH(40)}<div><b>Tusk</b><small>${h(S.project)}</small></div><button id="collapse" aria-label="Collapse sidebar" title="Collapse sidebar">${ic(document.body.classList.contains('collapsed')?'right':'left')}</button></div>`+PAGES.map(([k,l],i)=>`<button class="nav" data-p="${k}" ${k===page?'aria-current="page"':''} title="${l} (${i+1})"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg><span class="lbl">${l}</span>${badge[k]?`<span class="n ${badge[k][1]?'hot':''}">${badge[k][0]}</span>`:''}</button>`).join('')+`<div class="sp"></div><div class="foot">Keys 1-9 switch sections.<br>Esc closes details.</div>`;
}
const STAGE={initialized:0,planned:1,executing:2,executed:2,reported:3,fixed:4};
function renderTop(){
  const cur=STAGE[S.state.phase]??-1;
  const steps=['Init','Plan','Execute','Feedback','Fix'].map((l,i)=>`<span class="step ${i<cur?'done':i===cur?'cur':''}">${l}</span>`).join('');
  const recent=Date.now()/1000-lastOK<6,live=recent;
  $('#top').innerHTML=`<div><h1>${h(S.project)}</h1><div class="sub">orchestrated by ${h(S.orchestrator.name)} · ${h(S.orchestrator.model)}</div></div><div class="steps" aria-label="Stage">${steps}</div><span style="flex:1"></span>
  <span class="chip" title="Where the tests run">${ic("cpu")} ${h(S.target.mode==='ssh'?'host':'local')}: ${h(S.target.host)} · ${h(S.target.kind)}</span><span class="chip" title="Sandbox level used by agents">${ic("lock")} sandbox: ${h(S.sandbox.join(', ')||'none yet')}</span>
  <span class="chip" title="${streamOK?'Changes are pushed to this page the moment they happen':'Checking for changes every 2 seconds'}"><span class="dot ${live?'live':'stale'}"></span>${!live?'disconnected':streamOK?'live, updates instantly':'live, polling'}</span><button class="btn sm" id="th" aria-label="Change theme">${ic({auto:'auto',light:'sun',dark:'moon'}[theme])} ${{auto:'Auto',light:'Light',dark:'Dark'}[theme]}</button>`;
}
function setPage(p){page=p;store.set('tusk.page',p);closeDrawer();skeleton();fill()}

/* skeleton once per page, fill on each poll, so inputs keep focus */

 overview:()=>`<div id="banner"></div><h2>Right now</h2><div class="grid g4" id="kpis"></div><div class="grid g2" style="margin-top:12px"><div><h2>Running now</h2><div id="runnow"></div></div><div><h2>Latest activity</h2><div class="card feed" id="feed"></div></div></div><h2>Parallel lanes</h2><div class="lanes" id="lanes"></div>`,
 agents:()=>`<div class="tools">${[['cards','Cards'],['map','Map: who handles what'],['log','Assignments']].map(([k,l])=>`<button class="pill" data-atab="${k}" aria-pressed="${filters.atab===k}">${l}</button>`).join('')}</div><div id="atabc"></div>`,
 tests:()=>`<div id="covsum"></div><div class="tools"><input type="search" id="tq" placeholder="Search rules, areas, agents" aria-label="Search tests" value="${h(filters.tq)}">${['all','violated','failed-unconfirmed','passed','untested'].map(s=>`<button class="pill" data-st="${s}" aria-pressed="${filters.st===s}">${s==='all'?'All':s.replace(/-/g,' ')}</button>`).join('')}</div><div class="tw" id="ttab"></div><h2>Replay runs (each finding's repro, re-run in a clean lane)</h2><div class="tw" id="rtab"></div>`,
 findings:()=>`<div id="fsum" class="grid g2"></div><h2>Clusters</h2><div class="tools"><input type="search" id="fq" placeholder="Search findings" aria-label="Search findings" value="${h(filters.q)}">${['all','blocker','major','minor','nit'].map(s=>`<button class="pill" data-sev="${s}" aria-pressed="${filters.sev===s}">${s==='all'?'All':s}</button>`).join('')}</div><div class="tw" id="ftab"></div>`,
 fixes:()=>`<div id="pipe" class="pipe"></div><div class="card" style="margin-bottom:12px">${ic('info')} This page only shows progress. To approve a fix, tell the orchestrator in chat or run <code>/tusk-fix</code>; nothing is fixed, pushed or merged without that. Before each fix the knowledge graph lists the other issues and tests that share the same code, and the next run re-tests every fix.</div><div class="tools" id="fxtools"></div><div class="tw" id="fxtab"></div>`,
 team:()=>`<div id="teamv"></div>`,
 audit:()=>`<div id="achain"></div><div class="tools"><input type="search" id="aq" placeholder="Filter by actor, type or detail" aria-label="Filter audit log" value="${h(filters.aq)}"><a class="btn" href="/download/audit.json" download>${ic("dl")} audit.json</a></div><div class="tw" id="atab"></div>`,
 report:()=>`<div id="rsum"></div><div id="rbody"></div>`,
 graph:()=>`${graphBar()}<div class="legend"><span>${ic('bug')} issue colour = severity, ring = status (green fixed/verified, red open, dashed regressed)</span><span>square = file</span><span>diamond = rule</span><span>triangle = pinned test</span><span>hexagon = fix</span><span style="color:var(--bad)">red dashed link = a later issue may come from this fix</span></div><svg id="graph" class="gsvg" role="img" aria-label="Knowledge graph of code, rules, issues, tests and fixes"></svg>`};
function phead(k){const[t,d]=PHEAD[k];return `<div class="phead"><span class="ib">${ic(k,'lg')}</span><div><h1>${t}</h1><p>${d}</p></div></div>`}
function skeleton(){stopGraphs();if(page==='graph')loadKB();$('#view').innerHTML=phead(page)+SK[page]();if(page==='graph')startGraph();if(page==='audit')loadAudit();if(page==='report')loadReport();if(page==='team')loadTeam()}
function fill(){renderSide();renderTop();F[page]&&F[page]()}

const F={
 overview(){
  const n=S.next,sm=S.summary;
  $('#banner').innerHTML=`<div class="banner"><div style="flex:1;min-width:220px"><b>${h(n.text)}</b><div class="sub">${n.cmd?'Next step: run the command on the right.':n.tab?'Decide in chat: ask the orchestrator to approve (or run /tusk-fix).':'You can leave this page open; it updates by itself.'}</div></div>${n.cmd?`<code class="chip" style="font-size:13px">${h(n.cmd)}</code><button class="btn sm" data-copy="${h(n.cmd)}">${ic('copy')} Copy</button>`:''}${n.tab?`<button class="btn" data-go="${h(n.tab)}">${ic('fixes')} See them</button>`:''}</div>`;

  const run=S.agents.filter(a=>a.status==='running');
  $('#runnow').innerHTML=run.length?run.map(a=>`<div class="card agent" style="margin-bottom:8px" data-agent="${h(a.id)}" data-pop="agent|${h(a.id)}">${apet(a,44)}<div class="t"><b>${h(a.id)}</b> <span class="chip">${h(a.family)} / ${h(a.model)}</span><div class="now">${h(a.charter||'')} ${h(a.now)}</div></div></div>`).join(''):empty('No agent is running','Agents show up here while a wave is executing.');
  $('#feed').innerHTML=S.events.slice(-9).reverse().map(e=>`<div><time>${ago(e.ts)}</time>${petFor(e.actor)}<span><b>${h(e.actor)}</b> ${evText(e)}</span></div>`).join('')||empty('Quiet','No events yet.');
  const busy=new Set(run.map(a=>a.lane));$('#lanes').innerHTML=(S.lanes.length?S.lanes:['L1']).map(l=>`<span class="lane ${busy.has(l)?'busy':''}">${h(l)} ${busy.has(l)?'in use':'free'}</span>`).join('')},
 journey(){
  const J=S.journey,cur=J.find(x=>x.state==='current')||J[J.length-1];
  $('#jsteps').innerHTML=J.map((x,i)=>`<div class="jstep ${x.state}"><div class="n">${x.state==='done'?ic('check'):i+1}</div><b>${h(x.title)}</b><p>${h(x.text)}</p><div class="who">${ic('user')} ${h(x.who)}</div></div>`).join('');
  $('#jnow').innerHTML=`<div class="banner" style="margin-bottom:14px"><div style="flex:1;min-width:220px"><b>You are at: ${h(cur.title)}</b><div class="sub">${h(S.next.text)} ${S.next.cmd||cur.cmd?'Next command:':''}</div></div>${(S.next.cmd||cur.cmd)?`<code class="chip" style="font-size:13px">${h(S.next.cmd||cur.cmd)}</code><button class="btn sm" data-copy="${h(S.next.cmd||cur.cmd)}">${ic('copy')} Copy</button>`:''}</div>`;
  const cols=[['planned','Planned'],['doing','In progress'],['done','Done']];
  $('#board').innerHTML=cols.map(([k,l])=>{const it=S.board.filter(x=>x.state===k);return `<div class="col"><h4>${l} · ${it.length}</h4>${it.map(x=>`<div class="wi ${h(x.kind)}"><span class="chip">${ic({test:'tests',fix:'fixes',verify:'audit'}[x.kind]||'info')} ${h(x.kind)}</span> <b>${h(x.ref)}</b><div>${h(x.title)}</div><div class="o">${x.owners.length?x.owners.map(o=>`<span class="chip" data-agent="${h(o.id)}" style="cursor:pointer">${mpet(o.id,o.family)} ${h(o.id)} · ${h(o.model||o.family)}${o.lane?' · '+h(o.lane):''}</span>`).join(''):'<span class="sub">no owner yet</span>'}</div></div>`).join('')||'<div class="sub" style="padding:4px 6px">none</div>'}</div>`}).join('');
  $('#alog').innerHTML=S.assignments.slice(-14).reverse().map(x=>`<div><time>${ago(x.ts)}</time>${ORCH(20)}<span><b>${h(x.by)}</b> gave <b>${h(x.ref)}</b> (${h(x.kind)}) to <b>${h(x.to)}</b> ${x.model?`<span class="chip">${h(x.family)} / ${h(x.model)}</span>`:''} ${h(x.note)}</span></div>`).join('')||empty('No assignments yet','Each time the orchestrator hands work to an agent it is listed here.')},
 agents(){
  document.querySelectorAll('[data-atab]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.atab===filters.atab));
  const box=$('#atabc'),t=filters.atab;
  if(t!==box.dataset.t){box.dataset.t=t;stopGraphs();box.innerHTML=t==='map'?`<div class="legend"><span>${ic('user')} orchestrator in the middle</span><span>grey = assigned</span><span>dashed = handles</span><span style="color:var(--bad)">red = found</span><span style="color:var(--fix)">purple = judged / fixed</span><span>hover or click anything</span></div><svg id="amap" class="gsvg" role="img" aria-label="Which agent handles what"></svg>`:t==='log'?'<div class="tw" id="altab"></div>':'<h2>Orchestrator</h2><div id="orch"></div><h2>Testers, verifiers and fix agents</h2><div class="grid g3" id="roster"></div>';if(t==='map')startMap()}
  if(t==='map')return refreshMap();

  $('#orch').innerHTML=`<div class="card agent" data-pop="orch|0">${ORCH(56)}<div class="t"><b>${h(S.orchestrator.name)}</b> <span class="chip">${h(S.orchestrator.model)}</span><div class="sub" style="margin-top:4px">Plans the run, hands work to the agents below, lets scripts judge results, writes the report. Phase: ${h(S.state.phase||'not started')}.</div></div></div>`;
  $('#roster').innerHTML=S.agents.length?S.agents.map(a=>`<div class="card agent" data-agent="${h(a.id)}" data-pop="agent|${h(a.id)}">${apet(a,52)}<div class="t"><div><b>${h(a.id)}</b> <span class="dot ${h(a.status)}"></span> <span class="sub">${h(a.status)} · ${dur(a)}</span></div>
   <div style="margin-top:4px;display:flex;gap:5px;flex-wrap:wrap"><span class="chip" style="color:${acol(a)};border-color:${acol(a)}">${modelOf(a)}</span><span class="chip">${h(a.lens||a.role||'')}</span><span class="chip">${h(a.lane||'-')}</span><span class="chip">${num(a.findings)} found</span></div>
   <div class="now">${h(a.charter||'')} ${h(a.now)}</div>${a.status==='failed'||a.status==='tamper'?plainBlock(a.why,JSON.stringify(a.tech,null,1)):''}</div></div>`).join(''):empty('No agents yet','They appear when /tusk-execute dispatches the first wave.')},
 tests(){
  const t=S.tests,sm=S.summary.tests,tot=Math.max(1,sm.rules);
  $('#covsum').innerHTML=`<div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><b>${sm.rules-sm.untested} of ${sm.rules} rules tested</b><span class="sub">${sm.violated} violated · ${sm['failed-unconfirmed']} failed, unconfirmed · ${sm.passed} held · ${sm.untested} untested</span></div><div class="bar" style="margin-top:8px" role="img" aria-label="Rule outcomes"><i style="width:${sm.violated/tot*100}%;background:var(--bad)"></i><i style="width:${sm['failed-unconfirmed']/tot*100}%;background:var(--warn)"></i><i style="width:${sm.passed/tot*100}%;background:var(--ok)"></i></div></div>`;
  const q=filters.tq.toLowerCase(),rows=t.filter(r=>(filters.st==='all'||r.status===filters.st)&&(!q||(r.id+r.area+r.statement+Object.keys(r.agents).join(' ')).toLowerCase().includes(q)));
  $('#ttab').innerHTML=rows.length?`<table><thead><tr><th>Rule</th><th>What must be true</th><th>Result</th><th>Checked by</th><th>Charters</th></tr></thead><tbody>${rows.map(r=>`<tr class="${r.clusters.length?'click':''}" ${r.clusters[0]?`data-cluster="${h(r.clusters[0])}"`:''}><td><b>${h(r.id)}</b><div class="sub">${h(r.area)}</div></td><td>${h(r.statement)}<div class="sub">source: ${h(r.source)}</div></td><td>${stchip(r.status)}</td><td>${Object.entries(r.agents).map(([a,v])=>`<span class="chip" style="color:${v==='fail'?'var(--bad)':'var(--ok)'}">${h(a)} ${v==='fail'?'✗':'✓'}</span>`).join(' ')||'<span class="sub">nobody yet</span>'}</td><td>${r.charters.map(h).join(', ')}</td></tr>`).join('')}</tbody></table>`:empty('No rules match','Rules come from /tusk-plan.');
  const rp=S.replays;$('#rtab').innerHTML=rp.length?`<table><thead><tr><th>Agent</th><th>Finding</th><th>Result</th><th>Runs</th><th>Failure rate</th><th>Touches target</th><th>What it means</th></tr></thead><tbody>${rp.map(x=>`<tr><td>${h(x.agent)} <span class="sub">${h(x.lane)}</span></td><td>${h(x.finding)}</td><td>${stchip(x.status)}</td><td>${num(x.runs)}</td><td>${Math.round(num(x.fail_rate)*100)}%</td><td>${x.touches_target?'yes':'<span style="color:var(--warn)">no: needs verifier</span>'}</td><td>${h((x.why||{}).plain)}</td></tr>`).join('')}</tbody></table>`:empty('No replays yet','Every finding is re-run several times in a clean lane before it counts.')},
 findings(){
  const c=S.clusters,sm=S.summary.findings,mx=Math.max(1,...Object.values(sm).map(num));
  $('#fsum').innerHTML=`<div class="card"><b>By severity</b>${['blocker','major','minor','nit'].map(s=>`<div style="display:flex;gap:10px;align-items:center;margin-top:8px"><span style="width:56px">${s}</span><div class="bar" style="flex:1"><i style="width:${num(sm[s])/mx*100}%;background:${SEVC[s]}"></i></div><b>${num(sm[s])}</b></div>`).join('')}</div><div class="card"><b>New clusters per round</b>${S.rounds.length?`<svg width="100%" height="110" viewBox="0 0 ${Math.max(S.rounds.length*70,140)} 110" role="img" aria-label="Clusters per round"><polyline fill="none" stroke="var(--acc)" stroke-width="2.5" points="${S.rounds.map((r,i)=>`${i*70+25},${90-Math.min(75,num(r.new_clusters)*14)}`).join(' ')}"/>${S.rounds.map((r,i)=>`<circle cx="${i*70+25}" cy="${90-Math.min(75,num(r.new_clusters)*14)}" r="4" fill="var(--acc)"/><text x="${i*70+18}" y="106" font-size="11" fill="var(--mut)">r${num(r.round)}</text>`).join('')}</svg>`:empty('No rounds yet')}</div>`;
  const q=filters.q.toLowerCase(),rows=c.filter(x=>(filters.sev==='all'||x.severity===filters.sev)&&(!q||(x.cid+x.title+x.area+x.rule_id+x.agents.join(' ')).toLowerCase().includes(q)));
  $('#ftab').innerHTML=rows.length?`<table><thead><tr><th>Severity</th><th>Finding</th><th>Rule</th><th>Found by (agent, model)</th><th>Replay</th><th>Decision</th></tr></thead><tbody>${rows.map(x=>`<tr class="click" data-cluster="${h(x.cid)}"><td>${sevchip(x.severity)}</td><td><b>${h(x.title)}</b><div class="sub">${h(x.cid)} · ${h(x.area)}${(x.merge_reasons||[]).length?' · merged on '+x.merge_reasons.map(h).join(', '):''}</div></td><td>${h(x.rule_id)}</td><td>${x.found_by.map(fbchip).join(' ')}</td><td>${stchip(x.replay)}${x.fail_rate&&x.fail_rate<1?` ${Math.round(x.fail_rate*100)}%`:''}</td><td>${stchip(x.verdict==='reject'?'rejected':x.verdict)}<div class="sub" style="margin-top:3px">${h(x.decided_by?'by '+x.decided_by.by+(x.decided_by.model?' ('+x.decided_by.model+')':''):x.why.plain)}</div></td></tr>`).join('')}</tbody></table>`:empty('No findings','Clusters appear after /tusk-execute and /tusk-feedback.')},
 fixes(){
  const q=S.fixqueue,st=S.kb.status,STG=['open','approved','fixing','fixed','verified'],LB={open:'Found',approved:'Approved',fixing:'Fixing',fixed:'Fixed, awaiting re-test',verified:'Verified in a later run',regressed:'Regressed'};

  const stage=i=>{const life=i.life||'open',k=STG.indexOf(life);return `<span class="stage" title="${h(life)}">${STG.map((_,j)=>`<i class="${life==='regressed'?'bad':j<k?'on':j===k?(k>=3?'on':'cur'):''}"></i>`).join('')}</span>`};
  const rows=q.filter(i=>filters.fx==='all'||(i.life||'open')===filters.fx);
  $('#fxtab').innerHTML=rows.length?`<table><thead><tr><th>Severity</th><th>Issue</th><th>Progress</th><th>Status</th><th>Branch</th></tr></thead><tbody>${rows.map(i=>`<tr class="click" data-cluster="${h(i.cid)}"><td>${sevchip(i.severity)}</td><td><b>${h(i.title)}</b><div class="sub">${h(i.cid)} · ${h(i.area)} · ${h(i.kind)}</div></td><td>${stage(i)}</td><td>${stchip(i.life||i.state)}</td><td class="mono">${h(i.branch||'')}</td></tr>`).join('')}</tbody></table>`:empty('Nothing here','Failed or non-optimal results land here after /tusk-feedback.')},

/* force graphs: one engine, two views (knowledge graph, agent map) */
const GR={};
function stopGraphs(){Object.values(GR).forEach(g=>cancelAnimationFrame(g.raf))}
const TYPES={issue:'Issue',file:'File',rule:'Rule',area:'Area',test:'Test',fix:'Fix',agent:'Agent'};
const STATUSC={open:'var(--bad)',approved:'var(--warn)',fixing:'var(--info)',fixed:'var(--ok)',verified:'var(--ok)',regressed:'var(--bad)',wontfix:'var(--nit)',not_seen:'var(--nit)'};
function shape(n){const r=n.r;
  if(n.t==='issue')return `<circle r="${r}" fill="${SEVC[n.sev]||SEVC.nit}" stroke="${STATUSC[n.status]||'none'}" stroke-width="${n.status==='regressed'?4:3}" ${n.status==='regressed'?'stroke-dasharray="3 2"':''}/>`;
  if(n.t==='file')return `<rect x="${-r}" y="${-r*.75}" width="${r*2}" height="${r*1.5}" rx="3" fill="#7c93b8"/>`;
  if(n.t==='rule')return `<rect x="${-r*.8}" y="${-r*.8}" width="${r*1.6}" height="${r*1.6}" fill="#c4b5fd" transform="rotate(45)"/>`;
  if(n.t==='test')return `<path d="M0 ${-r}L${r} ${r*.8}L${-r} ${r*.8}Z" fill="#34d399"/>`;
  if(n.t==='fix'||n.t==='wfix')return `<path d="M${r} 0L${r/2} ${r*.87}L${-r/2} ${r*.87}L${-r} 0L${-r/2} ${-r*.87}L${r/2} ${-r*.87}Z" fill="#8b5cf6"/>`;
  if(n.t==='wtest')return `<rect x="${-r}" y="${-r*.7}" width="${r*2}" height="${r*1.4}" rx="5" fill="#10a37f"/>`;
  if(n.t==='wverify')return `<path d="M0 ${-r}L${r} ${r*.8}L${-r} ${r*.8}Z" fill="#f59e0b"/>`;
  return `<circle r="${r}" fill="#cbd5e1"/>`}
function fgMake(name,svg,o){stopGraphs();const g=GR[name]={G:{nodes:[],edges:[],sig:''},raf:0,drag:null,o,svg};return g}
function fgSet(g,nodes,edges){
  const ix=Object.fromEntries(nodes.map(n=>[n.id,n])),sig=nodes.map(n=>n.id).join()+edges.length,old=Object.fromEntries(g.G.nodes.map(n=>[n.id,n]));
  if(sig!==g.G.sig){nodes.forEach(n=>{const o=old[n.id];n.x=o?o.x:Math.random()*600+100;n.y=o?o.y:Math.random()*400+100;n.vx=n.vy=0});g.G={nodes,edges:edges.map(e=>[ix[e[0]],ix[e[1]],e[2]]).filter(e=>e[0]&&e[1]),sig}}
  else nodes.forEach(n=>{const m=g.G.nodes.find(o=>o.id===n.id);if(m){const{x,y,vx,vy}=m;Object.assign(m,n,{x,y,vx,vy})}})}
function fgStart(g){
  const svg=g.svg;cancelAnimationFrame(g.raf);const W=svg.clientWidth,Ht=svg.clientHeight;
  const tick=()=>{const N=g.G.nodes;if(!N.length){svg.innerHTML=`<text x="${W/2}" y="${Ht/2}" text-anchor="middle" fill="var(--mut)" font-size="14">${h(g.o.empty)}</text>`;g.raf=requestAnimationFrame(tick);return}
   for(const a of N){for(const b of N){if(a===b)continue;const dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+.01,f=1800/d2,d=Math.sqrt(d2);a.vx+=dx*f/d;a.vy+=dy*f/d}a.vx+=(W/2-a.x)*.002;a.vy+=(Ht/2-a.y)*.002}
   for(const[a,b]of g.G.edges){const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1,f=(d-100)*.02;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f}
   for(const n of N){if(n===g.drag)continue;n.vx*=.8;n.vy*=.8;n.x=Math.max(26,Math.min(W-26,n.x+n.vx));n.y=Math.max(26,Math.min(Ht-30,n.y+n.vy))}
   const dim=n=>g.o.dim&&g.o.dim(n);
   svg.innerHTML=g.G.edges.map(([a,b,rel])=>{const st=g.o.edge(rel);return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${st.c}" stroke-width="${st.w}" ${st.d?'stroke-dasharray="4 3"':''} opacity="${dim(a)&&dim(b)?.2:1}"/>`}).join('')+g.G.nodes.map(n=>{const av=n.avatar?n.avatar(n.r):null,o=n.r*1.1,lab=(n.label||'').slice(0,n.t==='file'?26:18);
    return `<g data-n="${h(n.id)}" opacity="${dim(n)?.2:1}" transform="translate(${n.x-(av?o:0)} ${n.y-(av?o:0)})" style="cursor:pointer">${av||shape(n)}<text y="${n.r*(av?2.2:1)+11}" x="${av?o:0}" text-anchor="middle" font-size="10" fill="var(--mut)">${h(lab)}</text></g>`}).join('');
   g.raf=requestAnimationFrame(tick)};tick();
  svg.onmousedown=e=>{const t=e.target.closest('[data-n]');if(t){g.drag=g.G.nodes.find(n=>n.id===t.dataset.n);if(g.drag)g.drag.moved=false}};
  svg.onmousemove=e=>{const r=svg.getBoundingClientRect();if(g.drag){g.drag.moved=true;g.drag.x=e.clientX-r.left;g.drag.y=e.clientY-r.top;g.drag.vx=g.drag.vy=0}const t=e.target.closest('[data-n]');if(!t){hidePop();return}const n=g.G.nodes.find(m=>m.id===t.dataset.n);if(n)showPop(g.o.hover(n),e)};
  svg.onmouseup=()=>{if(g.drag&&!g.drag.moved)g.o.click(g.drag);g.drag=null};svg.onmouseleave=()=>{hidePop();g.drag=null}}
const infoPop=n=>`<h4>${h(n.label)}</h4><dl>${Object.entries(n.info||{}).filter(([,v])=>v!==''&&v!==undefined).map(([k,v])=>`<dt>${h(k)}</dt><dd>${h(v)}</dd>`).join('')}</dl>`;

/* knowledge graph */
function kbVisible(){
  if(!kbData)return{nodes:[],edges:[]};const T=filters.types,tag=filters.tag;let ids=new Set(kbData.nodes.filter(n=>T[n.t]).map(n=>n.id));
  if(tag){const hit=new Set(kbData.nodes.filter(n=>ids.has(n.id)&&n.tags.includes(tag)).map(n=>n.id)),keep=new Set(hit);kbData.edges.forEach(e=>{if(hit.has(e[0])&&ids.has(e[2]))keep.add(e[2]);if(hit.has(e[2])&&ids.has(e[0]))keep.add(e[0])});ids=keep}
  const nodes=kbData.nodes.filter(n=>ids.has(n.id)).map(n=>({...n,info:{type:TYPES[n.t],status:n.status,severity:n.sev,area:n.area,rule:n.s,found_by:(n.by||[]).map(b=>b.a+' ('+b.m+')').join(', '),tags:n.tags.slice(0,8).join(', ')},r:n.t==='issue'?({blocker:13,major:10,minor:8,nit:6}[n.sev]||7):n.t==='file'?9:6}));
  const edges=kbData.edges.filter(e=>ids.has(e[0])&&ids.has(e[2])).map(e=>[e[0],e[2],e[1]]);
  if(T.agent&&S)S.agents.forEach(a=>{const id='g:'+a.id;nodes.push({id,t:'agent',label:a.id,agent:a,avatar:r=>apet(a,r*2.2),info:{},r:14,tags:[]});S.clusters.forEach(k=>{if(k.agents.includes(a.id)&&ids.has('i:'+k.cid))edges.push([id,'i:'+k.cid,'found'])})});
  return{nodes,edges}}
function graphBar(){const T=filters.types,cnt={};if(kbData)kbData.nodes.forEach(n=>n.tags.forEach(t=>{if(!t.startsWith('type:'))cnt[t]=(cnt[t]||0)+1}));
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,16).map(x=>x[0]);if(filters.tag&&!top.includes(filters.tag))top.unshift(filters.tag);
  return `<div id="gbar"><div class="tools"><input type="search" id="gq" placeholder="Highlight by file, issue, rule or tag" aria-label="Search graph" value="${h(filters.gq)}">${Object.entries(TYPES).map(([k,l])=>`<button class="pill" data-type="${k}" aria-pressed="${!!T[k]}">${l}</button>`).join('')}<span class="sub">${kbData?kbData.nodes.length+' nodes, '+kbData.edges.length+' links':''}</span></div><div class="tools" style="margin-top:-4px">${ic('tag')}${top.map(t=>`<button class="pill" data-tag="${h(t)}" aria-pressed="${filters.tag===t}">${h(t)} ${cnt[t]||''}</button>`).join('')||'<span class="sub">tags appear once issues are in the graph</span>'}</div></div>`}
function startGraph(){
  const svg=$('#graph');if(!svg)return;
  const g=fgMake('kb',svg,{empty:'No knowledge yet. It fills after /tusk-feedback builds a report.',edge:rel=>rel==='suspected_cause'?{c:'var(--bad)',w:2,d:1}:rel==='found'?{c:'var(--bad)',w:1.4}:{c:'var(--line)',w:1.4},
   dim:n=>{const q=filters.gq.toLowerCase();return q&&!((n.label||'')+' '+(n.tags||[]).join(' ')).toLowerCase().includes(q)},
   hover:n=>n.agent?popFor(n.agent):infoPop(n),click:n=>openNode(n.id)});
  refreshKB();fgStart(g)}
function refreshKB(){const g=GR.kb;if(!g)return;const v=kbVisible();fgSet(g,v.nodes,v.edges)}
async function openNode(id){
  if(id.startsWith('g:'))return openAgent(id.slice(2));
  if(id.startsWith('i:')&&S.clusters.some(c=>c.cid===id.slice(2)))return openCluster(id.slice(2));
  const n=kbData.nodes.find(x=>x.id===id);if(!n)return;const dr=$('#drawer');dr.classList.add('open');dr.innerHTML='<div class="empty">Loading...</div>';
  let t=null;try{t=await api('/api/trace?id='+encodeURIComponent(id.slice(2)))}catch(e){}
  const nb=kbData.edges.filter(e=>e[0]===id||e[2]===id).map(e=>({rel:e[0]===id?e[1]:'is '+e[1]+' by',n:kbData.nodes.find(x=>x.id===(e[0]===id?e[2]:e[0]))})).filter(x=>x.n);
  dr.innerHTML=`<button class="btn sm x" id="dx">Close</button><h3>${h(n.label)}</h3><div><span class="chip">${h(TYPES[n.t])}</span> ${n.status?stchip(n.status):''} ${n.sev?sevchip(n.sev):''}</div>${n.s?`<p>${h(n.s)}</p>`:''}
  ${traceHtml(t)}<h4>Connected to</h4>${nb.map(x=>`<div class="sub"><b>${h(x.rel)}</b> ${h(TYPES[x.n.t])}: ${h(x.n.label)}</div>`).join('')||'<div class="sub">nothing</div>'}`}
async function loadKB(){try{kbData=await api('/api/kb')}catch(e){kbData=null}if(page==='graph'){refreshKB();const b=$('#gbar');if(b&&!b.contains(document.activeElement))b.outerHTML=graphBar()}}

/* agent map: who handles what, who assigned it */
function mapData(){
  const nodes={},edges=[],add=(id,o)=>{if(!nodes[id])nodes[id]={id,r:12,info:{},tags:[],...o};return nodes[id]};
  add('orch',{t:'orch',label:S.orchestrator.name,r:22,avatar:r=>ORCH(r*2),info:{role:'orchestrator',model:S.orchestrator.model}});
  const agentNode=(id,x)=>{const known=S.agents.find(a=>a.id===id)||{id,family:x&&x.family||'',model:x&&x.model||'',role:x&&x.kind==='fix'?'fix':x&&x.kind||'tester',status:'',lens:'',lane:'',charter:'',findings:0,now:''};return add('a:'+id,{t:'agent',label:id,r:14,agent:known,avatar:r=>apet(known,r*2.2)})};
  S.agents.forEach(a=>{agentNode(a.id);edges.push(['orch','a:'+a.id,'assigned'])});
  S.assignments.forEach(x=>{const an=agentNode(x.to,x);if(!edges.some(e=>e[0]==='orch'&&e[1]===an.id))edges.push(['orch',an.id,'assigned']);const wid='w:'+x.kind+':'+x.ref;add(wid,{t:{charter:'wtest',fix:'wfix',verify:'wverify'}[x.kind]||'wtest',label:x.ref,r:9,info:{kind:x.kind,work:x.note,owner:x.to,model:x.family+' / '+x.model}});edges.push([an.id,wid,'handles']);if(x.kind==='fix'&&S.clusters.some(c=>c.cid===x.ref))edges.push([wid,'i:'+x.ref,'judged'])});
  S.clusters.forEach(c=>{add('i:'+c.cid,{t:'issue',label:c.cid.slice(0,8),sev:c.severity,status:S.fixqueue.find(f=>f.cid===c.cid)?.life||'',r:{blocker:13,major:10,minor:8,nit:6}[c.severity]||7,info:{title:c.title,severity:c.severity,decision:c.verdict}});
   c.found_by.forEach(f=>{agentNode(f.id,{family:f.family,model:f.model});edges.push(['a:'+f.id,'i:'+c.cid,'found'])});
   if(c.decided_by){const vid=c.decided_by.by===S.orchestrator.name?'orch':'a:'+c.decided_by.by;if(vid!=='orch')agentNode(c.decided_by.by,{family:c.decided_by.family,model:c.decided_by.model,kind:'verify'});edges.push([vid,'i:'+c.cid,'judged'])}});
  return{nodes:Object.values(nodes),edges}}
function startMap(){
  const svg=$('#amap');if(!svg)return;
  const g=fgMake('map',svg,{empty:'No agents yet.',edge:rel=>rel==='found'?{c:'var(--bad)',w:1.6}:rel==='judged'?{c:'var(--fix)',w:1.6}:rel==='handles'?{c:'var(--mut)',w:1.2,d:1}:{c:'var(--line)',w:1.6},
   hover:n=>n.agent?popFor(n.agent):infoPop(n),click:n=>n.agent&&S.agents.some(a=>a.id===n.agent.id)?openAgent(n.agent.id):n.t==='issue'?openCluster(n.id.slice(2)):n.agent?openAgent(n.agent.id):0});
  refreshMap();fgStart(g)}
function refreshMap(){const g=GR.map;if(!g||!S)return;const d=mapData();fgSet(g,d.nodes,d.edges)}

/* events */
document.addEventListener('click',async e=>{
  const t=e.target;let el;
  if(t.closest('#collapse')){document.body.classList.toggle('collapsed');store.set('tusk.side',document.body.classList.contains('collapsed')?'1':'0');return renderSide()}
  if(t.closest('#th'))return cycleTheme();
  if(el=t.closest('[data-type]')){filters.types[el.dataset.type]=filters.types[el.dataset.type]?0:1;refreshKB();const b=$('#gbar');if(b)b.outerHTML=graphBar();return}
  if(el=t.closest('[data-tag]')){filters.tag=filters.tag===el.dataset.tag?'':el.dataset.tag;refreshKB();const b=$('#gbar');if(b)b.outerHTML=graphBar();return}
  if(el=t.closest('[data-atab]')){filters.atab=el.dataset.atab;return F.agents()}
  if(el=t.closest('.nav'))return setPage(el.dataset.p);
  if(t.id==='dx')return closeDrawer();
  if(el=t.closest('[data-copy]')){try{await navigator.clipboard.writeText(el.dataset.copy);toast('Copied')}catch(x){toast('Copy failed')}return}
  if(el=t.closest('[data-go]'))return setPage(el.dataset.go);
  if(el=t.closest('[data-sev]')){filters.sev=el.dataset.sev;skeleton();return fill()}
  if(el=t.closest('[data-st]')){filters.st=el.dataset.st;skeleton();return fill()}
  if(el=t.closest('[data-fx]')){filters.fx=el.dataset.fx;return F.fixes()}
  if(el=t.closest('[data-cluster]')){if(t.closest('input'))return;return openCluster(el.dataset.cluster)}
  if(el=t.closest('[data-agent]'))return openAgent(el.dataset.agent);
});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='tq'){filters.tq=t.value;F.tests()}if(t.id==='fq'){filters.q=t.value;F.findings()}if(t.id==='gq'){filters.gq=t.value}if(t.id==='aq'){filters.aq=t.value;clearTimeout(loadAudit.t);loadAudit.t=setTimeout(loadAudit,250)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;const i=parseInt(e.key,10);if(i>=1&&i<=PAGES.length)setPage(PAGES[i-1][0])});
if(store.get('tusk.side')==='1')document.body.classList.add('collapsed');
let first=true,streamOK=false,lastEv=null;
function announce(){
  const evs=S.events;if(lastEv===null){lastEv=evs.length?evs[evs.length-1].ts:0;return}
  const fresh=evs.filter(e=>e.ts>lastEv&&['agent_start','agent_done','assign','verdict','fix_state','retest','report_built','model_exhausted'].includes(e.type));if(evs.length)lastEv=Math.max(lastEv,evs[evs.length-1].ts);
  if(!fresh.length)return;
  const say=e=>({agent_start:`${e.actor} started (${e.family}/${e.model})`,agent_done:`${e.actor} finished${e.rc&&e.rc!=='0'?' with a problem':''}, ${e.findings||0} finding(s)`,assign:`${e.actor} gave ${e.ref} to ${e.to}`,verdict:`${e.actor} decided ${e.cid}: ${e.verdict}`,fix_state:`${e.cid} is now ${e.state}`,retest:`${e.cid} re-test: ${e.result}`,report_built:'Report built',model_exhausted:`${e.actor}: model ${e.model} is out of quota`}[e.type]||'');
  toast(say(fresh[fresh.length-1])+(fresh.length>1?`  (+${fresh.length-1} more)`:''),3800)}
async function load(){try{S=await api('/api/state');lastOK=Date.now()/1000;if(first){first=false;skeleton()}announce();fill();if(page==='audit')loadAudit();if(page==='graph')loadKB();if(page==='team'&&!teamDirty)loadTeam()}catch(e){if(S)renderTop()}}
function connectStream(){try{const es=new EventSource('/api/stream');es.onmessage=()=>load();es.onopen=()=>{streamOK=true;if(S)renderTop()};es.onerror=()=>{streamOK=false;if(S)renderTop()}}catch(e){}}
load();connectStream();setInterval(()=>{if(!streamOK||Date.now()/1000-lastOK>20)load()},2000);
</script></body></html>
