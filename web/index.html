<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UAT Swarm</title>
<style>
@font-face{font-family:Figtree;src:url(/fonts/Figtree.ttf) format("truetype");font-weight:300 900;font-display:swap}
:root{--bg:#f6f6f3;--panel:#fff;--panel2:#fbfbf9;--ink:#191917;--mut:#6b6b64;--line:#e5e5df;--acc:#2f6fed;--acc-ink:#fff;--ok:#2f9e44;--warn:#e8890c;--bad:#d92d20;--info:#3b82f6;--shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);
 --claude:#d97757;--codex:#10a37f;--opencode:#3b82f6;--tool:#868e96;--fix:#8b5cf6;--blocker:#d92d20;--major:#f08c00;--minor:#2f9e44;--nit:#868e96}
:root[data-theme=dark]{--bg:#111110;--panel:#1a1a18;--panel2:#161614;--ink:#ecebe6;--mut:#9a9a92;--line:#2b2b28;--acc:#6b9bff;--acc-ink:#0b0b0a;--ok:#4cc16a;--warn:#f3a33b;--bad:#ff6b5e;--info:#6ea8ff;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]):not([data-theme=dark]){--bg:#111110;--panel:#1a1a18;--panel2:#161614;--ink:#ecebe6;--mut:#9a9a92;--line:#2b2b28;--acc:#6b9bff;--acc-ink:#0b0b0a;--ok:#4cc16a;--warn:#f3a33b;--bad:#ff6b5e;--info:#6ea8ff;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;grid-template-columns:224px minmax(0,1fr);grid-template-rows:auto 1fr}
button,input,select{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
a{color:var(--acc)}code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
#side{grid-row:1/3;background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px}.brand b{font-weight:700;font-size:16px;letter-spacing:-.01em}.brand small{display:block;color:var(--mut);font-size:11px;margin-top:-2px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:9px;cursor:pointer;text-align:left;color:var(--mut);font-weight:500}
.nav:hover{background:var(--panel2);color:var(--ink)}.nav[aria-current=page]{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--ink);font-weight:600}
.nav .n{margin-left:auto;font-size:11px;font-weight:600;padding:0 7px;border-radius:99px;background:var(--line);color:var(--ink)}.nav .n.hot{background:var(--bad);color:#fff}
.nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sp{flex:1}#side .foot{color:var(--mut);font-size:11px;padding:8px}
#top{display:flex;gap:14px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;position:sticky;top:0;z-index:4}
#top h1{font-size:15px;margin:0;font-weight:700}.sub{color:var(--mut);font-size:12px}
.steps{display:flex;gap:4px;align-items:center}.step{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--mut)}.step.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}.step.cur{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--mut);white-space:nowrap;background:var(--panel2)}
.btn{display:inline-block;border:1px solid var(--line);background:var(--panel);padding:6px 13px;border-radius:9px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink)}.btn:hover{border-color:var(--mut)}.btn.p{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}.btn.d{border-color:color-mix(in srgb,var(--bad) 50%,var(--line));color:var(--bad)}.btn:disabled{opacity:.4;cursor:default}.btn.sm{padding:3px 10px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--nit);display:inline-block;flex:none}.dot.running{background:var(--codex);animation:p 1.2s infinite}.dot.done{background:var(--ok)}.dot.failed,.dot.tamper{background:var(--bad)}.dot.live{background:var(--ok)}.dot.stale{background:var(--warn)}
@keyframes p{50%{opacity:.35}}@media (prefers-reduced-motion:reduce){.dot.running{animation:none}}
main{padding:20px 24px 60px;max-width:1360px;width:100%}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:22px 0 10px;font-weight:700}h2:first-child{margin-top:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}.kpi .l{color:var(--mut);font-size:12px;font-weight:500}.kpi .s{font-size:12px;color:var(--mut);margin-top:4px}
.banner{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:14px;background:color-mix(in srgb,var(--acc) 11%,var(--panel));border:1px solid color-mix(in srgb,var(--acc) 35%,var(--line));flex-wrap:wrap}.banner b{font-size:15px}
.agent{display:flex;gap:12px;cursor:pointer}.agent:hover{border-color:var(--mut)}.agent .t{min-width:0;flex:1}.now{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:600;font-size:12px;background:var(--panel2);position:sticky;top:0}tbody tr:hover{background:var(--panel2)}tr.click{cursor:pointer}
.tw{border:1px solid var(--line);border-radius:14px;overflow:auto;background:var(--panel);max-height:70vh}
.sev,.st{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;color:#fff;white-space:nowrap;display:inline-block}.sev.blocker{background:var(--blocker)}.sev.major{background:var(--major)}.sev.minor{background:var(--minor)}.sev.nit{background:var(--nit)}
.st{color:var(--ink);background:var(--line)}.st.passed,.st.proven,.st.done,.st.accept,.st.confirmed{background:color-mix(in srgb,var(--ok) 22%,var(--panel));color:var(--ok)}.st.violated,.st.failed,.st.tamper,.st.needs_human,.st.reject{background:color-mix(in srgb,var(--bad) 18%,var(--panel));color:var(--bad)}.st.failed-unconfirmed,.st.needs_verifier,.st.proposed,.st.flaky,.st.watch{background:color-mix(in srgb,var(--warn) 22%,var(--panel));color:var(--warn)}.st.approved,.st.fixing,.st.running{background:color-mix(in srgb,var(--info) 20%,var(--panel));color:var(--info)}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line)}.bar i{display:block;height:100%}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.tools input[type=search]{flex:1;min-width:200px;padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.pill{border:1px solid var(--line);background:var(--panel);padding:4px 11px;border-radius:99px;cursor:pointer;font-size:12px;font-weight:600;color:var(--mut)}.pill[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.feed>div{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--line);align-items:center;font-size:13px}.feed time{color:var(--mut);font-size:11px;width:34px;flex:none}.feed span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--mut);padding:36px;text-align:center}.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
#drawer{position:fixed;top:0;right:0;height:100vh;width:min(620px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(105%);transition:transform .18s;z-index:30;overflow:auto;padding:20px}#drawer.open{transform:none}@media (prefers-reduced-motion:reduce){#drawer{transition:none}}
#drawer h3{margin:0 0 6px;font-size:17px}#drawer h4{margin:18px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}#drawer pre{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin:0}
.x{float:right}.kv{display:grid;grid-template-columns:90px 1fr;gap:4px 12px}.kv dt{color:var(--mut)}.kv dd{margin:0;word-break:break-word}
#pop{position:fixed;pointer-events:none;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 13px;box-shadow:var(--shadow);max-width:320px;display:none;font-size:12px}#pop h4{margin:0 0 5px;font-size:13px}#pop dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}#pop dt{color:var(--mut)}#pop dd{margin:0}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}#toast.on{opacity:1}
#graph{width:100%;height:620px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 10px;font-size:12px;color:var(--mut)}
.lanes{display:flex;gap:8px;flex-wrap:wrap}.lane{padding:6px 11px;border-radius:9px;border:1px dashed var(--line);font-size:12px;color:var(--mut)}.lane.busy{border-style:solid;border-color:var(--codex);color:var(--ink)}
@media(max-width:860px){body{grid-template-columns:minmax(0,1fr)}#side{grid-row:auto;flex-direction:row;height:auto;position:static;overflow-x:auto}#side .foot,.brand small,#side .sp{display:none}.nav .n{display:none}.nav{width:auto;white-space:nowrap}main{padding:16px}}
</style></head><body>
<nav id="side" aria-label="Sections"></nav>
<header id="top"></header>
<main id="view" tabindex="-1"></main>
<aside id="drawer" aria-label="Details" role="dialog"></aside>
<div id="pop" role="tooltip"></div><div id="toast" role="status" aria-live="polite"></div>
<script nonce="__NONCE__">
const TOKEN=decodeURIComponent(location.hash.slice(1));history.replaceState(null,'',location.pathname);
const $=s=>document.querySelector(s);
const h=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=x=>Number.isFinite(Number(x))?Number(x):0;
const FAM={claude:'var(--claude)',codex:'var(--codex)',opencode:'var(--opencode)',tool:'var(--tool)',fix:'var(--fix)'};
const SEVC={blocker:'var(--blocker)',major:'var(--major)',minor:'var(--minor)',nit:'var(--nit)'};
const PETS=['cat','dog','fox','panda','frog','rabbit','owl','penguin','bear','koala'];
const hash=s=>[...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const PAGES=[['overview','Overview'],['agents','Agents'],['tests','Tests'],['findings','Findings'],['fixes','Fixes'],['audit','Audit log'],['report','Report'],['graph','Graph']];
let S=null,page=store.get('uat.page'),filters={sev:'all',q:'',st:'all',tq:'',aq:'',fx:'all'},sel=new Set(),lastOK=0,reportData=null,auditData=null;
if(!PAGES.some(p=>p[0]===page))page='overview';
const ICON={overview:'<path d="M3 12 12 4l9 8M5 10v10h14V10"/>',agents:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M15 14.5c3 0 6 1.5 6 5.5"/>',tests:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/>',findings:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',fixes:'<path d="M14 6a4 4 0 0 0-5 5l-6 6 3 3 6-6a4 4 0 0 0 5-5l-3 3-2-2z"/>',audit:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>',report:'<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h6M9 17h6"/>',graph:'<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 7l8 1M7.5 8.3 11 15.7M16.8 10 13 16"/>'};

/* theme: auto follows the OS, light/dark override and persist */
function applyTheme(t){const r=document.documentElement;if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t)}
let theme=store.get('uat.theme');if(!['auto','light','dark'].includes(theme))theme='auto';applyTheme(theme);
function cycleTheme(){theme={auto:'light',light:'dark',dark:'auto'}[theme];store.set('uat.theme',theme);applyTheme(theme);renderTop();toast('Theme: '+theme)}

/* avatars */
function pet(id,color,size,kind,badge){
  kind=kind||PETS[hash(id)%PETS.length];const d='#222';
  const ears={cat:'<path d="M10 20 14 4 24 14ZM54 20 50 4 40 14Z"/>',dog:'<ellipse cx="9" cy="26" rx="7" ry="13"/><ellipse cx="55" cy="26" rx="7" ry="13"/>',fox:'<path d="M8 24 12 2 26 14ZM56 24 52 2 38 14Z"/>',panda:'<circle cx="12" cy="12" r="8" fill="#222"/><circle cx="52" cy="12" r="8" fill="#222"/>',frog:'<circle cx="17" cy="14" r="8"/><circle cx="47" cy="14" r="8"/>',rabbit:'<ellipse cx="22" cy="10" rx="5" ry="15"/><ellipse cx="42" cy="10" rx="5" ry="15"/>',owl:'<path d="M10 22 12 6 26 14ZM54 22 52 6 38 14Z"/>',penguin:'',bear:'<circle cx="12" cy="14" r="8"/><circle cx="52" cy="14" r="8"/>',koala:'<circle cx="10" cy="22" r="11" fill="#999"/><circle cx="54" cy="22" r="11" fill="#999"/>',elephant:'<ellipse cx="8" cy="34" rx="11" ry="17" fill="#9aa0a6"/><ellipse cx="56" cy="34" rx="11" ry="17" fill="#9aa0a6"/>'}[kind]||'';
  const face=kind==='panda'?'#f4f4f4':kind==='elephant'?'#c3c7cc':'#fff';
  const extra=kind==='elephant'?'<path d="M32 38c0 14-2 18-8 20" stroke="#8a9096" stroke-width="7" fill="none" stroke-linecap="round"/>':kind==='penguin'?'<ellipse cx="32" cy="44" rx="12" ry="12" fill="#eee"/>':kind==='owl'?'<circle cx="24" cy="30" r="9" fill="#fff"/><circle cx="40" cy="30" r="9" fill="#fff"/>':kind==='frog'?'':'<ellipse cx="32" cy="44" rx="7" ry="5" fill="#f3d6d0"/>';
  const eye=x=>kind==='panda'?`<ellipse cx="${x}" cy="30" rx="6" ry="7" fill="#222" transform="rotate(${x<32?-20:20} ${x} 30)"/><circle cx="${x}" cy="30" r="2" fill="#fff"/>`:`<circle cx="${x}" cy="30" r="3.2" fill="${d}"/>`;
  const wr=badge?`<g transform="translate(40 40)"><circle cx="10" cy="10" r="10" fill="#8b5cf6"/><path d="M6 14 13 7M11 5l4 4" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/></g>`:'';
  return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true"><g fill="${color}" stroke="${color}" stroke-width="1">${ears}</g><circle cx="32" cy="34" r="22" fill="${face}" stroke="${color}" stroke-width="3"/>${extra}${eye(24)}${eye(40)}${kind==='frog'?'':`<circle cx="32" cy="40" r="2.6" fill="${d}"/>`}<path d="M27 46q5 4 10 0" stroke="${d}" stroke-width="2" fill="none" stroke-linecap="round"/>${wr}</svg>`}
const acol=a=>a.role==='fix'?FAM.fix:FAM[a.family]||FAM.tool;
const apet=(a,s)=>pet(a.id,acol(a),s,null,a.role==='fix');
const ORCH=s=>pet('orch','#6b7280',s||40,'elephant');

/* helpers */
const ago=t=>{const s=Math.max(0,Math.round(S.now-t));return s<60?s+'s':s<3600?Math.round(s/60)+'m':Math.round(s/3600)+'h'};
const mmss=s=>{s=Math.max(0,Math.round(s));return s>=3600?`${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m`:`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const dur=a=>a.started?mmss((a.ended||S.now)-a.started):'-';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}
const sevchip=s=>`<span class="sev ${h(s)}">${h(s)}</span>`,stchip=s=>`<span class="st ${h(s)}">${h(String(s).replace(/-/g,' '))}</span>`;
const empty=(t,d)=>`<div class="empty"><b>${h(t)}</b>${h(d||'')}</div>`;
const EVT={agent_start:'started',agent_done:'finished',model_exhausted:'ran out of model quota',lane_reset:'reset a lane',replay:'replayed',clusters:'grouped findings',validate:'validated findings',report_built:'built the report',verdict:'gave a verdict',fix_state:'moved a fix',wave:'started a wave',phase:'update',step:'',check:'checked'};
function evText(e){const base=EVT[e.type]??e.type;const x=e.text||e.now||(e.rule?e.rule+' '+(e.result||''):'')||e.status||e.state||'';return `${h(base)} ${h(x)}`.trim()}
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'X-UAT-Token':TOKEN,'Content-Type':'application/json'},body:JSON.stringify(body)}:{});if(!r.ok)throw new Error(r.status);return r.json()}
const petFor=id=>{const a=S.agents.find(x=>x.id===id);return a?apet(a,20):ORCH(20)};

/* shell */
function renderSide(){
  const q=S.fixqueue.filter(i=>i.state==='proposed').length,run=S.summary.agents.running;
  const badge={agents:run?[run,0]:null,fixes:q?[q,1]:null,findings:S.clusters.length?[S.clusters.length,0]:null,tests:S.summary.tests.rules?[S.summary.tests.rules,0]:null,audit:S.audit.count?[S.audit.count,0]:null};
  $('#side').innerHTML=`<div class="brand">${ORCH(40)}<div><b>UAT Swarm</b><small>${h(S.project)}</small></div></div>`+PAGES.map(([k,l],i)=>`<button class="nav" data-p="${k}" ${k===page?'aria-current="page"':''} title="${l} (${i+1})"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>${l}${badge[k]?`<span class="n ${badge[k][1]?'hot':''}">${badge[k][0]}</span>`:''}</button>`).join('')+`<div class="sp"></div><div class="foot">Keys 1-8 switch sections.<br>Esc closes details.</div>`;
}
const STAGE={initialized:0,planned:1,executing:2,executed:2,reported:3,fixed:4};
function renderTop(){
  const cur=STAGE[S.state.phase]??-1;
  const steps=['Init','Plan','Execute','Feedback','Fix'].map((l,i)=>`<span class="step ${i<cur?'done':i===cur?'cur':''}">${l}</span>`).join('');
  const live=Date.now()/1000-lastOK<6;
  $('#top').innerHTML=`<div><h1>${h(S.project)}</h1><div class="sub">orchestrated by ${h(S.orchestrator.name)} · ${h(S.orchestrator.model)}</div></div><div class="steps" aria-label="Stage">${steps}</div><span style="flex:1"></span>
  <span class="chip" title="Where the tests run">${h(S.target.mode==='ssh'?'host':'local')}: ${h(S.target.host)} · ${h(S.target.kind)}</span><span class="chip" title="Sandbox level used by agents">sandbox: ${h(S.sandbox.join(', ')||'none yet')}</span>
  <span class="chip"><span class="dot ${live?'live':'stale'}"></span>${live?'live':'stale'}</span><button class="btn sm" id="th" aria-label="Change theme">${{auto:'Auto',light:'Light',dark:'Dark'}[theme]} theme</button>`;
}
function setPage(p){page=p;store.set('uat.page',p);closeDrawer();skeleton();fill()}

/* skeleton once per page, fill on each poll, so inputs keep focus */
const SK={
 overview:()=>`<div id="banner"></div><h2>Right now</h2><div class="grid g4" id="kpis"></div><div class="grid g2" style="margin-top:12px"><div><h2>Running now</h2><div id="runnow"></div></div><div><h2>Latest activity</h2><div class="card feed" id="feed"></div></div></div><h2>Parallel lanes</h2><div class="lanes" id="lanes"></div>`,
 agents:()=>`<h2>Orchestrator</h2><div id="orch"></div><h2>Testers and fix agents</h2><div class="grid g3" id="roster"></div>`,
 tests:()=>`<div id="covsum"></div><div class="tools"><input type="search" id="tq" placeholder="Search rules, areas, agents" aria-label="Search tests" value="${h(filters.tq)}">${['all','violated','failed-unconfirmed','passed','untested'].map(s=>`<button class="pill" data-st="${s}" aria-pressed="${filters.st===s}">${s==='all'?'All':s.replace(/-/g,' ')}</button>`).join('')}</div><div class="tw" id="ttab"></div><h2>Replay runs (each finding's repro, re-run in a clean lane)</h2><div class="tw" id="rtab"></div>`,

function showPop(html,e){const p=$('#pop');p.innerHTML=html;p.style.display='block';p.style.left=Math.max(4,Math.min(e.clientX+14,innerWidth-340))+'px';p.style.top=Math.max(4,Math.min(e.clientY+14,innerHeight-230))+'px'}
const hidePop=()=>{$('#pop').style.display='none'};
document.addEventListener('mousemove',e=>{if(!S)return;const t=e.target.closest('[data-pop]');if(!t){if(!e.target.closest('#graph'))hidePop();return}const[k,id]=t.dataset.pop.split('|');const a=k==='agent'?S.agents.find(x=>x.id===id):null;if(a)showPop(popFor(a),e);else if(k==='orch')showPop(`<h4>Orchestrator</h4><dl><dt>model</dt><dd>${h(S.orchestrator.model)}</dd><dt>role</dt><dd>plans, assigns, judges by script, reports</dd></dl>`,e)});

let G={nodes:[],edges:[],sig:''},raf=0,drag=null;
function buildGraph(){
  const nodes=[],edges=[],ix={};const add=(id,o)=>{if(!ix[id]){ix[id]={id,x:Math.random()*600+100,y:Math.random()*400+100,vx:0,vy:0,...o};nodes.push(ix[id])}return ix[id]};
  add('orch',{type:'orchestrator',label:'Orchestrator',r:22,color:'#6b7280',info:{model:S.orchestrator.model}});
  S.agents.forEach(a=>{add('a:'+a.id,{type:a.role==='fix'?'fix':'agent',label:a.id,r:14,color:acol(a),agent:a});edges.push(['orch','a:'+a.id])});
  (S.charters||[]).forEach(c=>{const a=S.agents.find(x=>x.charter===c.id);add('c:'+c.id,{type:'charter',label:c.id,r:8,color:'#94a3b8',info:{area:c.area,lens:c.lens}});if(a)edges.push(['a:'+a.id,'c:'+c.id]);(c.rule_ids||[]).forEach(rid=>{if(S.clusters.some(k=>k.rule_id===rid)){add('r:'+rid,{type:'rule',label:rid,r:6,color:'#cbd5e1',info:{rule:((S.rules||[]).find(x=>x.id===rid)||{}).statement}});edges.push(['c:'+c.id,'r:'+rid])}})});
  S.clusters.forEach(k=>{const fq=S.fixqueue.find(f=>f.cid===k.cid);add('k:'+k.cid,{type:'finding',label:k.cid.slice(0,8),r:{blocker:14,major:11,minor:8,nit:6}[k.severity]||6,color:SEVC[k.severity],info:{title:k.title,severity:k.severity,replay:k.replay,verdict:k.verdict,fix:fq?fq.state:'-'}});k.agents.forEach(id=>ix['a:'+id]&&edges.push(['a:'+id,'k:'+k.cid]));if(k.rule_id&&ix['r:'+k.rule_id])edges.push(['r:'+k.rule_id,'k:'+k.cid])});
  const sig=nodes.map(n=>n.id).join();
  if(sig!==G.sig)G={nodes,edges:edges.filter(e=>ix[e[0]]&&ix[e[1]]).map(e=>[ix[e[0]],ix[e[1]]]),sig};
  else nodes.forEach(n=>{const m=G.nodes.find(o=>o.id===n.id);if(m)Object.assign(m,{info:n.info,agent:n.agent,color:n.color})})}
function startGraph(){
  const svg=$('#graph');if(!svg)return;cancelAnimationFrame(raf);buildGraph();const W=svg.clientWidth,Ht=svg.clientHeight;
  const tick=()=>{const N=G.nodes;
   for(const a of N){for(const b of N){if(a===b)continue;const dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+.01,f=1400/d2,d=Math.sqrt(d2);a.vx+=dx*f/d;a.vy+=dy*f/d}a.vx+=(W/2-a.x)*.002;a.vy+=(Ht/2-a.y)*.002}
   for(const[a,b]of G.edges){const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1,f=(d-90)*.02;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f}
   for(const n of N){if(n===drag)continue;n.vx*=.82;n.vy*=.82;n.x=Math.max(24,Math.min(W-24,n.x+n.vx));n.y=Math.max(24,Math.min(Ht-30,n.y+n.vy))}
   svg.innerHTML=G.edges.map(([a,b])=>`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="var(--line)" stroke-width="1.5"/>`).join('')+G.nodes.map(n=>{const av=n.type==='orchestrator'?ORCH(n.r*2):n.agent?apet(n.agent,n.r*2.2):null;const o=n.r*1.1;
    return `<g data-n="${h(n.id)}" transform="translate(${n.x-(av?o:0)} ${n.y-(av?o:0)})" style="cursor:grab">${av||`<circle r="${n.r}" fill="${n.color}"/>`}<text y="${n.r*2.2+10}" x="${av?o:0}" text-anchor="middle" font-size="10" fill="var(--mut)">${h(n.label)}</text></g>`}).join('');
   raf=requestAnimationFrame(tick)};tick();
  svg.onmousedown=e=>{const g=e.target.closest('[data-n]');if(g)drag=G.nodes.find(n=>n.id===g.dataset.n)};
  svg.onmousemove=e=>{const r=svg.getBoundingClientRect();if(drag){drag.x=e.clientX-r.left;drag.y=e.clientY-r.top;drag.vx=drag.vy=0}const g=e.target.closest('[data-n]');if(!g){hidePop();return}const n=G.nodes.find(m=>m.id===g.dataset.n);if(!n)return;
   if(n.agent)showPop(popFor(n.agent),e);else showPop(`<h4>${h(n.label)} · ${h(n.type)}</h4><dl>${Object.entries(n.info||{}).map(([k,v])=>`<dt>${h(k)}</dt><dd>${h(v)}</dd>`).join('')}</dl>`,e)};
  svg.onmouseleave=hidePop}
addEventListener('mouseup',()=>{drag=null});

/* events */
document.addEventListener('click',async e=>{
  const t=e.target;let el;
  if(t.id==='th')return cycleTheme();
  if(el=t.closest('.nav'))return setPage(el.dataset.p);
  if(t.id==='dx')return closeDrawer();
  if(el=t.closest('[data-copy]')){try{await navigator.clipboard.writeText(el.dataset.copy);toast('Copied')}catch(x){toast('Copy failed')}return}
  if(el=t.closest('[data-go]'))return setPage(el.dataset.go);
  if(el=t.closest('[data-act]')){const cid=el.dataset.cid;try{await api('/api/fix/'+el.dataset.act,{ids:[cid]});toast(el.dataset.act==='approve'?'Approved. Run /uat-fix to start it.':'Rejected');await load();openCluster(cid)}catch(x){toast('Failed: '+x.message)}return}
  if(t.matches('input[data-id]')){t.checked?sel.add(t.dataset.id):sel.delete(t.dataset.id);return F.fixes()}
  if(el=t.closest('[data-sev]')){filters.sev=el.dataset.sev;skeleton();return fill()}
  if(el=t.closest('[data-st]')){filters.st=el.dataset.st;skeleton();return fill()}
  if(el=t.closest('[data-fx]')){filters.fx=el.dataset.fx;return F.fixes()}
  if(t.id==='ap'||t.id==='rj'||t.id==='apb'){const p=t.id==='rj'?'/api/fix/reject':'/api/fix/approve',body=t.id==='apb'?{severities:['blocker','major']}:{ids:[...sel]};try{const r=await api(p,body);sel.clear();toast(`${(r.changed||[]).length} item(s) ${t.id==='rj'?'rejected':'approved'}`);await load()}catch(x){toast('Failed: '+x.message)}return}
  if(el=t.closest('[data-cluster]')){if(t.closest('input'))return;return openCluster(el.dataset.cluster)}
  if(el=t.closest('[data-agent]'))return openAgent(el.dataset.agent);
});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='tq'){filters.tq=t.value;F.tests()}if(t.id==='fq'){filters.q=t.value;F.findings()}if(t.id==='aq'){filters.aq=t.value;clearTimeout(loadAudit.t);loadAudit.t=setTimeout(loadAudit,250)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;const i=parseInt(e.key,10);if(i>=1&&i<=PAGES.length)setPage(PAGES[i-1][0])});
let first=true;
async function load(){try{S=await api('/api/state');lastOK=Date.now()/1000;if(first){first=false;skeleton()}fill();if(page==='audit')loadAudit();if(page==='graph')buildGraph()}catch(e){if(S)renderTop()}}
load();setInterval(load,1500);
</script></body></html>
